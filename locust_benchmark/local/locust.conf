# Local runs (local/run.sh, local/run_single.sh).
# Read by locust (--config); paths are relative to locust_benchmark/, mounted at /work.
# Locust's own options use their command-line names.
locustfile = locustfile.py
headless = true
# With local/run.sh this is also the number of worker containers: one user each.
users = 4
spawn-rate = 1
# Seconds.
run-time = 60
stop-timeout = 30
# Distributed runs: give up if the workers have not all connected within this many seconds.
expect-workers-max-wait = 120
html = results/report.html
only-summary = true

# Options this test adds (registered in locustfile.py).
# Rows loaded into the feature groups and read from.
rows = 1000
batch-size = 10
# Online store clients to read through: rest, sql, or both (rest,sql).
# See README.md, Limitations, before enabling sql.
clients = rest
# Reuse the rows already loaded; rows must not exceed what was loaded.
skip-setup = false
