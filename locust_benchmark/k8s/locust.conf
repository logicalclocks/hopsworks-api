# In-cluster runs (k8s/run.sh).
# users, run-time and html are set per run by the script.
locustfile = locustfile.py
headless = true
spawn-rate = 4
stop-timeout = 30
# Workers pull the image and log in before the test starts.
expect-workers-max-wait = 300
only-summary = true

# Options this test adds (registered in locustfile.py).
rows = 1000
batch-size = 10
# See README.md, Limitations, before enabling sql.
clients = rest
# The master loads the data when this is false; set it to true once the rows are loaded.
skip-setup = false
