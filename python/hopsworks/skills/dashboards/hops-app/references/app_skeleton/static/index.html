<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer lookup</title>
  <script>
    // Relative URLs resolve against the proxy mount only with a trailing slash.
    if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search);
  </script>
  <link rel="stylesheet" href="static/app.css">
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header class="band"><h1>Customer lookup</h1></header>
  <main>
    <form id="lookup">
      <label for="customer">Customer id</label>
      <input id="customer" name="customer" type="number" min="1" required>
      <button type="submit">Look up</button>
    </form>
    <section id="result" aria-live="polite"></section>
    <h2>Highest risk</h2>
    <table id="top"><thead><tr><th>Customer</th><th>Score</th></tr></thead><tbody></tbody></table>
  </main>
</body>
</html>
