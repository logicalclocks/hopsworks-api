# The example ML systems offered by `hops build` and `/hops-ml`.
# `new_system.py <dir>/<slug> --example <slug>` merges one entry into a new system.yaml.
# An example runs on synthetic data and always gets a Python app with a JavaScript UI,
# so neither the data sources nor the app are asked for.

churn-example:
  label: "Churn: which customers will cancel next month (batch)"
  system:
    name: Churn next month
  requirements:
    description: which telco customers will churn in the next 30 days
    system_type: batch
    sla:
      batch: {cadence: weekly}
    consumers: ui
    # The story's volume, confirmed by the example's author so the data phase asks nothing:
    # 5,000 customers is above the small tier's 2,000 event entities, and 60 days of usage
    # before the first snapshot plus the snapshots' span is about 3 million events.
    sizing:
      tier: small
      confirmed_above_cap: >-
        ~5,000 customers x ~21 weekly snapshots (~105k rows); ~3M usage events (~300 MB offline)
        over ~5,000 entities; no live stream and no online store, since weekly batch scoring reads
        only the offline store
    data_sources:
      - {name: customers, kind: synthetic, shape: batch, status: needs_generation}
      - {name: usage_events, kind: synthetic, shape: events, status: needs_generation}
  data:
    customers:
      generator:
        story: >-
          5,000 telco customers with plan, tenure, monthly charges and support calls, as a weekly
          snapshot of every active customer taken on Mondays at 00:00 UTC; about 15% churn within
          a month, more often on month-to-month plans with rising charges and many support calls.
          The feature view is rooted at the snapshot, so the weekly batch scoring reads the newest
          snapshot by time range, and the labels (customer, snapshot, churned within 30 days) join
          on both keys. A scheduled snapshot job writes exactly the snapshots on the Monday grid
          inside its window, so a weekly fire never writes seven
      writes:
        feature_group: customers
        version: 1
        online: false
        time_travel_format: DELTA
        primary_key: [customer_id, snapshot_date]
        event_time: snapshot_date
    usage_events:
      generator:
        story: >-
          daily calls, data use and top-ups per customer; churners' usage decays over their last
          60 days. Backfill only: a batch system has no live stream
      writes:
        feature_group: usage_events
        version: 1
        online: false
        time_travel_format: DELTA
        primary_key: [event_id]
        event_time: ts
    status: pending
  app:
    wanted: true
    kind: query_ui
    name: churn-example-app
    description: >-
      A churn-risk console for the retention team: headline numbers, risk by plan, the highest-risk
      customers ranked with a risk bar and exportable as CSV, and a search by customer id showing
      the score and the features behind it with a what-if score for a different tenure. It reads
      the prediction feature group the batch job writes, and the what-if score loads the same
      registered model into the app; a batch system has no deployment
    status: pending

recs-example:
  label: "Personalized recommendations: the products each shopper is likely to buy next (real-time)"
  system:
    name: Personalized recommendations
  requirements:
    description: which products a shopper is most likely to buy next, scored per request
    system_type: realtime
    sla:
      realtime: {p99_ms: 100, throughput_qps: 100}
    consumers: ui
    data_sources:
      - {name: users, kind: synthetic, shape: batch, status: needs_generation}
      - {name: items, kind: synthetic, shape: batch, status: needs_generation}
      - {name: interactions, kind: synthetic, shape: events, status: needs_generation}
  data:
    users:
      generator:
        story: 2,000 shoppers with age band, country and favourite categories
    items:
      generator:
        story: 500 products with category, price and popularity
    interactions:
      generator:
        story: >-
          views, add-to-carts and purchases; a shopper mostly buys in their favourite categories
          and near their usual price
    status: pending
  app:
    wanted: true
    kind: query_ui
    name: recs-example-app
    description: >-
      A storefront: pick a shopper and see their top ten products as product cards ranked by the
      deployment's purchase probability, with the shopper's recent history beside them
    status: pending

helpdesk-example:
  label: "Help desk agent: answers support questions from your documents and the customer's recent events (agentic)"
  system:
    name: Help desk agent
  requirements:
    description: >-
      answer a customer's support question from the help desk documents the user uploads and the
      customer's recent purchases and returns, citing the document, page and paragraph
    system_type: agent
    problem:
      task: rag
    sla:
      agent: {p99_ms: 8000, throughput_qps: 2}
    consumers: ui
    data_sources:
      - {name: docs, kind: file, status: needs_download}
      - {name: user_events, kind: synthetic, shape: events, status: needs_generation}
  data:
    # Built as hops-reqs/references/rag-agent.md says, from its rag_agent/ files.
    docs:
      path: Resources/helpdesk-docs
      formats: [pdf, txt, md, docx, odt]
      ask: >-
        the build creates the directory, then asks the user to upload documents there, or to use the
        sample documents
    user_events:
      generator:
        story: >-
          500 customers, each with a few purchases over the last 90 days (product_name, amount); some
          purchases are later returned, refunded, delivered late or complained about, each an event with
          its event_time
      writes:
        feature_group: user_events
        version: 1
        online: true
        primary_key: [user_id, event_id]
        event_time: event_time
    status: pending
  features:
    pipelines:
      - name: doc_chunks
        run: scheduled
        reads: [docs]
        writes:
          feature_group: helpdesk_doc_chunks
          version: 1
          online: true
          primary_key: [chunk_id]
          embedding_index: {feature: embedding, similarity: cosine}
          columns: [chunk_id, doc_name, path, url, page, offset, text, embedding]
        job: {name: helpdesk-example-ingest-docs}
        status: pending
    status: pending
  training:
    required: false
    embedding_model:
      repo: sentence-transformers/all-MiniLM-L6-v2
      name: helpdesk_embedder
    job: {name: helpdesk-example-register-embedder}
    status: pending
  inference:
    mode: agent
    agent:
      deployment: helpdeskagent
      framework: langgraph
      request: {user_id: int, query: string, k: 25}
      steps: [events, retrieve, answer]
    status: pending
  app:
    wanted: true
    kind: chat
    name: helpdesk-example-app
    description: >-
      A JavaScript help desk UI: pick a user id from the users with events, write a question and press
      Send; it shows the agent's answer, the cited passages with a link to each document (page and
      paragraph), and the user's recent events the agent read
    status: pending
