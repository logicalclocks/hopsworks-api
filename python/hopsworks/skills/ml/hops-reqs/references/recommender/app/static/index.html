<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Storefront</title>
  <script>
    // Relative URLs resolve against the proxy mount only with a trailing slash.
    if (!location.pathname.endsWith("/")) location.replace(location.pathname + "/" + location.search);
  </script>
  <link rel="stylesheet" href="static/app.css">
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header class="band">
    <div class="mark" aria-hidden="true">H</div>
    <div>
      <h1>Storefront</h1>
      <div class="sub">Personalized H&amp;M recommendations: two-tower retrieval, then a CatBoost ranking, per request</div>
    </div>
  </header>
  <main>
    <section class="card">
      <form class="pick" id="pick">
        <div>
          <label for="customer">Customer</label>
          <select id="customer" required><option value="">Loading…</option></select>
        </div>
        <button type="submit" id="recommend">Recommend</button>
        <button type="button" class="secondary" id="refresh" disabled>New recommendations</button>
      </form>
    </section>
    <section class="grid" aria-label="Session">
      <div class="card stat"><div class="label">Shown</div><div class="value" id="shown">0</div></div>
      <div class="card stat"><div class="label">Clicked</div><div class="value accent" id="clicked">0</div></div>
      <div class="card stat"><div class="label">Bought</div><div class="value accent" id="bought">0</div></div>
      <div class="card stat"><div class="label">Ignored</div><div class="value" id="ignored">0</div></div>
      <div class="card stat"><div class="label">Last lookup</div><div class="value" id="latency">–</div><div class="muted" id="roundtrip"></div></div>
    </section>
    <div class="split">
      <section class="card">
        <h2>Recommended for this customer</h2>
        <div class="timings" id="timings"></div>
        <div class="products" id="products" aria-live="polite">
          <p class="muted">Pick a customer and press Recommend.</p>
        </div>
      </section>
      <section class="card">
        <h2>History</h2>
        <ul class="history" id="history"><li class="muted">The customer's recent interactions appear here.</li></ul>
      </section>
    </div>
  </main>
</body>
</html>
